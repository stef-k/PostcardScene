[project]
name = "postcardscene"
version = "0.1.0.dev0"
description = "A self-hosted ambient media and information display appliance"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.16,<2",
    "flask>=3.1,<4",
    "flask-login>=0.6.3,<0.7",
    "flask-wtf>=1.2.2,<2",
    "packaging>=25,<27",
    "pillow>=11,<13",
    "sqlalchemy>=2.0,<3",
    "waitress>=3,<4",
    "websockets>=15,<17",
]

[project.scripts]
postcardscene-backup = "postcardscene.backup.cli:main"
postcardscene-doctor = "postcardscene.doctor.cli:main"
postcardscene-web = "postcardscene.web.server:main"
postcardscene-input-emitter = "postcardscene.graphics.local_input:main"
postcardscene-runtime = "postcardscene.runtime.cli:main"

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
