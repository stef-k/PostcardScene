name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.11'
      - name: Require exact package tag before building
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version
          PYTHON
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Build and smoke final archive bytes
        run: uv run python scripts/build_release.py --output "$RUNNER_TEMP/native-release"
      - uses: actions/upload-artifact@v4
        with:
          name: native-release
          path: ${{ runner.temp }}/native-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-release
          path: native-release
      - name: Publish verified candidate through a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: native-release
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$GITHUB_SHA"
          sha256sum --check --strict SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "PostcardScene $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" postcardscene-*-linux-native.tar.gz \
            postcardscene-*-py3-none-any.whl SHA256SUMS
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published"
          cmp SHA256SUMS "$RUNNER_TEMP/published/SHA256SUMS"
          (cd "$RUNNER_TEMP/published" && sha256sum --check --strict SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Report incomplete publication
        if: failure()
        run: echo 'Publication failed. Inspect any created draft and its assets; publication state may be uncertain after a failed API response.'
