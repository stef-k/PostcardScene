name: Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Root-only restore and update contracts
        if: matrix.python == '3.11'
        run: sudo .venv/bin/python -B -m pytest tests/test_backup_restore.py tests/test_restore_execution.py tests/test_update_host.py tests/test_update_transaction.py tests/test_update_recovery.py tests/test_update_finish.py
      - run: uv build
        if: matrix.python == '3.11'
      - run: uv run python scripts/check_release_inputs.py
        if: matrix.python == '3.11'

  installed-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12"
      - run: git fetch --no-tags origin fde2cd540220e53c19d726147aa8956f45ce0d91
      - name: Build frozen CI predecessor and current native candidate
        run: python3 -B scripts/build_update_evidence.py /tmp/postcardscene-update-artifacts
      - run: sudo apt-get update && sudo apt-get install --yes python3-venv
      - name: Prepare trusted parent in the disposable runner
        run: |
          stat -c '%U:%G %a %n' /opt
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo python3 - <<'PYTHON'
          import os
          path = "/opt"
          inherited = "system.posix_acl_default" in os.listxattr(path)
          print("Disposable /opt default ACL present:", inherited)
          if inherited:
              os.removexattr(path, "system.posix_acl_default")
          PYTHON
      - name: Real two-UID installed Linux software evidence
        run: sudo /usr/bin/python3 -B scripts/smoke_native_install.py /tmp/postcardscene-update-artifacts/candidate/*.whl
      - name: Public forward update and bounded interruption evidence
        run: sudo /usr/bin/python3 -B scripts/smoke_update.py /tmp/postcardscene-update-artifacts
