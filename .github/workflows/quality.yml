name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
        if: matrix.python == '3.11'
      - run: uv run python scripts/check_release_inputs.py
        if: matrix.python == '3.11'

  installed-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: "3.12"
      - run: uv build --wheel --no-sources
      - run: sudo apt-get update && sudo apt-get install --yes python3-venv
      - name: Real two-UID installed Linux software evidence
        run: sudo /usr/bin/python3 -B scripts/smoke_native_install.py dist/*.whl
