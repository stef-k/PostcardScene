{% extends "base.html" %}
{% block title %}{{ code }} · {{ name }}{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-9 col-xl-8">
    <p class="eyebrow mb-3">Request error</p>
    <h1 class="mb-4">{{ code }} · {{ name }}</h1>

  </div>
</div>
{% endblock %}
